name: wasm

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  emscripten:
    name: Emscripten (SDL2, IA-32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CMakeLists.txt builds the version string from `git describe --tags`.
          fetch-depth: 0

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.0
          actions-cache-folder: emsdk-cache

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config

      - name: Configure
        run: emcmake cmake -S . -B build-em -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-em --target emnp21kai_sdl2 -- -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: emnp21kai_sdl2
          path: |
            build-em/emnp21kai_sdl2.html
            build-em/emnp21kai_sdl2.js
            build-em/emnp21kai_sdl2.wasm
